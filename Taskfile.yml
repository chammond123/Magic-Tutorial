version: '3'

tasks:
  build:
    desc: Build the C++ game engine
    cmds:
      - make -f Makefile.project
    dir: .

  rebuild:
    desc: Clean and rebuild the C++ game engine
    cmds:
      - make -f Makefile.project clean
      - make -f Makefile.project
    dir: .

  run:engine:
    desc: Run the compiled C++ game engine
    cmds:
      - ./build/bin/MagicTutorial
    dir: .

  run:server:
    desc: Start the Express server
    deps: [install:server]
    cmds:
      - node server.js
    dir: server

  install:react:
    desc: Install React app dependencies
    cmds:
      - npm install
    dir: magic-react-app

  install:server:
    desc: Install server dependencies
    cmds:
      - npm install
    dir: server

  install:deps:
    desc: Install all project dependencies
    deps: [install:react, install:server]

  run:react:dev:
    desc: Start the React app in development mode
    deps: [install:react]
    cmds:
      - npm run dev
    dir: magic-react-app

  run:react:
    desc: Build and serve React app in production mode
    deps: [install:react]
    cmds:
      - npm run build
      - npm run preview
    dir: magic-react-app

  run:dev:
    desc: Start engine, server, and React app in development mode (parallel)
    deps: [build]
    cmds:
      - task -p run:engine &
      - task -p run:server &
      - task -p run:react:dev &
    dir: .

  run:local:
    desc: Start engine, server, and React app in normal mode (parallel)
    deps: [build]
    cmds:
      - task -p run:engine &
      - task -p run:server &
      - task -p run:react &
    dir: .
